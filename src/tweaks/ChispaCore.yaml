# Protocolo CHISPA / SPARKY Protocol — TweakXL Core Definitions (Base Game 2.x)

# ---------------------------------------------------------------------------
# Marcador de Misión (Mapa del Mundo + Minimapa + 3D)
# ---------------------------------------------------------------------------

Mappins.ChispaQuestMappin:
  $base: Mappins.QuestStaticMappinDefinition
  showInWorld: true
  showOnMap: true
  showOnMinimap: true
  visibilityRange: 100000.0
  possibleVariants:
    - Mappins.DefaultQuestVariant

# ---------------------------------------------------------------------------
# Coprocesador C.H.I.S.P.A. v0.98b & Arma Icónica de Bienvenida
# ---------------------------------------------------------------------------

Items.Chispa_CoreDongle:
  $base: Items.q001_netrunner_software_shard
  displayName: LocKey#ch_item_dongle_name
  localizedDescription: LocKey#ch_item_dongle_desc
  quality: Quality.Legendary
  tags:
    - !append-once Quest

Items.ChispaLexingtonAbility:
  $base: Items.IconicWeaponModAbilityBase
  UIData:
    $type: gamedataGameplayLogicPackageUIData_Record
    localizedDescription: LocKey#ch_weapon_lex_ability

Items.ChispaLexingtonIconicMod:
  $base: Items.IconicWeaponModBase
  OnAttach:
    - Items.ChispaLexingtonAbility
  statModifiers:
    - !append-once
      $type: gamedataConstantStatModifier_Record
      modifierType: Additive
      statType: BaseStats.ElectricDamage
      value: 18.0
    - !append-once
      $type: gamedataConstantStatModifier_Record
      modifierType: Additive
      statType: BaseStats.CritChance
      value: 12.0
    - !append-once
      $type: gamedataConstantStatModifier_Record
      modifierType: Multiplier
      statType: BaseStats.ReloadTime
      value: 0.80

Items.Preset_Lexington_Chispa:
  $base: Items.Preset_Lexington_Default
  displayName: LocKey#ch_weapon_lex_name
  localizedDescription: LocKey#ch_weapon_lex_desc
  quality: Quality.Rare
  tags:
    - !append-once IconicWeapon
  statModifiers:
    - !append-once
      $type: gamedataConstantStatModifier_Record
      modifierType: Additive
      statType: BaseStats.IsItemIconic
      value: 1.0
  slotPartListPreset:
    - !append-once
      $type: gamedataSlotItemPartPreset_Record
      slot: AttachmentSlots.IconicWeaponModLegendary
      itemPartPreset: Items.ChispaLexingtonIconicMod

