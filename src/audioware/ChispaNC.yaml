  ch_ep05_outro_leak:
    en-us:
      file: ./audio/en/ch_ep05_outro_leak.ogg
      subtitle: Payload dumped straight onto N54's broadcast feed—plus forty-five hundred eddies wired before NetWatch clips the cable! Don't worry, my backup daemon stays tucked inside your Kiroshi to watch those corpo stock charts burn.
    es-es:
      file: ./audio/es/ch_ep05_outro_leak.ogg
      subtitle: ¡Bomba soltada por media red pública y cuatro mil quinientos edis de propina en tu cuenta antes de que NetWatch cierre el grifo! Tranquilo, me quedo agazapado en tus ópticas viendo arder los titulares de la tarde. Ha sido un honor patear calles contigo, recluta.
