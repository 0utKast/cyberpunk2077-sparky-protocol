      file: ./audio/es/ch_ep00_ans_deal.ogg
      subtitle: 'Sencillo y sin PowerPoints aburridos: antes de que estos dos idiotas me encontraran, las bandas de Night City saquearon cinco sectores de mi memoria llenos de trucos reales de netrunner, armas tecnológicas, secretos corporativos y cuentas congeladas. Tú me ayudas a recuperarlos en la calle y yo te mantengo con vida.'
