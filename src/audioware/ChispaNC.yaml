  ch_ep02_ans_maelstrom:
    en-us:
      file: ./audio/en/ch_ep02_ans_maelstrom.ogg
      subtitle: Northside was pitched as an automated freight and meatpacking engine for Night City's rebuild. When corporate margins moved elsewhere, gangs claimed the rusted shells. Maelstrom scooped up the hardest metal-cult fanatics—gouging out healthy eyes just to prove flesh no longer owns them.
    es-es:
      file: ./audio/es/ch_ep02_ans_maelstrom.ogg
      subtitle: 'Northside nació como polígono automatizado de muelles y fábricas cárnicas para alimentar la reconstrucción de Night City. Cuando los márgenes corporativos se desplazaron, las bandas ocuparon las naves vacías. Maelstrom juntó a los fanáticos más extremistas del transhumanismo callejero: se arrancan ojos y rostros sanos solo para demostrarse que la carne ya no manda en ellos.'
    es-mx:
      file: ./audio/es/ch_ep02_ans_maelstrom.ogg
      subtitle: 'Northside nació como polígono automatizado de muelles y fábricas cárnicas para alimentar la reconstrucción de Night City. Cuando los márgenes corporativos se desplazaron, las bandas ocuparon las naves vacías. Maelstrom juntó a los fanáticos más extremistas del transhumanismo callejero: se arrancan ojos y rostros sanos solo para demostrarse que la carne ya no manda en ellos.'
