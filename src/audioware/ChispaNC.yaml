  ch_ep05_outro_partner:
    en-us:
      file: ./audio/en/ch_ep05_outro_partner.ogg
      subtitle: Outstanding, partner! Root permissions unlocked and Synapse Burnout synced to your cyberdeck. Around here you don't need a drink named after you—just survive tomorrow and laugh in the suits' faces. Standing by in your optics!
    es-es:
      file: ./audio/es/ch_ep05_outro_partner.ogg
      subtitle: '¡Firme ahí, socio! Coprocesador liberado al cien por cien y subrutina de Sinapsis enviada a tu terminal. En esta ciudad no hace falta morir como leyenda de holo: basta con sobrevivir un día más y reírse de los peces gordos. A tu orden cuando llames, recluta.'
