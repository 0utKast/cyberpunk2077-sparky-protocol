  ch_ep00_ans_night:
    en-us:
      file: ./audio/en/ch_ep00_ans_night.ogg
      subtitle: 'Richard Night—a nineties corporate visionary who wanted a tax-free paradise called Coronado City, bankrolled by Arasaka, Petrochem, and EBM. Fun punchline: he hired mobsters as contractors, pissed them off, and got gunned down in his penthouse in 1998. They renamed the corpse-heap Night City in his honor.'
    es-es:
      file: ./audio/es/ch_ep00_ans_night.ogg
      subtitle: 'Richard Night, un iluminado de los años noventa que soñaba con Coronado City: cero sindicatos, cero impuestos y megacorporaciones como Arasaka, Petrochem o EBM pagando la fiesta. Como detalle cómico, contrató a la mafia para limpiar los barrios... y en mil novecientos noventa y ocho lo cosieron a tiros en su propio ático. Rebautizaron la ciudad con su nombre como trofeo.'
