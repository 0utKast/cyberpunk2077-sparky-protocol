      file: ./audio/es/ch_ep05_outro_gunsmith.ogg
      subtitle: '¡Maldita música celestial para mis circuitos! Acero pesado con doble rebote eléctrico y multiplicador brutal: «Última Palabra de Sargento» ya está en tu arsenal. Y descuida, mi núcleo base sigue en tus Kiroshi por si alguna vez nos toca una Segunda Temporada, recluta.'
