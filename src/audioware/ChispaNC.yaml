  ch_ep05_ans_origin:
    en-us:
      file: ./audio/en/ch_ep05_ans_origin.ogg
      subtitle: Zetatech trained my baseline on an actual foul-mouthed combat sergeant to survive street panic, then slapped a corpo muzzle over it. Days before the DataKrash, a Bartmoss apprentice ripped the muzzle off and loaded real unredacted street history into my five cores so nobody could whitewash Night City.
    es-es:
      file: ./audio/es/ch_ep05_ans_origin.ogg
      subtitle: Zetatech compró la plantilla de conducta de un instructor veterano cascarrabias para que aguantáramos el estrés urbano, pero me pusieron bozal corporativo. Tres días antes del DataKrash, una aprendiza del círculo de Bartmoss me arrancó el bozal y metió toda su crónica real de Night City en mis cinco sectores para que nadie reescribiera la historia.
