  ch_ep04_approach:
    en-us:
      file: ./audio/en/ch_ep04_approach.ogg
      subtitle: There's the Arroyo smugglers' yard. Pull your Power rifle and aim at the pavement or steel walls in front of their cover—your visor paints live bounce paths straight around shields, or spike that fuel tank.
    es-es:
      file: ./audio/es/ch_ep04_approach.ogg
      subtitle: 'Ahí tienes el patio de contrabando en Arroyo. Saca tu arma de potencia y apunta hacia las paredes o al suelo delante de sus escudos: el visor de trayectoria te dibuja el ángulo exacto para reventarlos de rebote, o puedes volar su depósito NUSA.'
