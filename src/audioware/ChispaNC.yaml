  ch_ep01_ans_krash:
    en-us:
      file: ./audio/en/ch_ep01_ans_krash.ogg
      subtitle: RABIDS wasn't just malware—it was an army of self-mutating daemons rewriting protocols, shredding firewalls, and unleashing military AIs into the Old Net. Seventy-eight point three percent of global cyberspace collapsed overnight. That's why today you're jumping through local subnets and hardwired cameras block by block.
    es-es:
      file: ./audio/es/ch_ep01_ans_krash.ogg
      subtitle: 'Los RABIDS no eran un simple virus: eran ejércitos de daemons mutantes que reescribían protocolos, borraban cortafuegos y soltaban IAs experimentales de investigación militar por toda la Red antigua. En cuestión de días cayó el setenta y ocho coma tres por ciento de la Red mundial. Por eso hoy dependes de subredes cerradas, cámaras enlazadas y cables locales en cada distrito.'
