  ch_ep01_approach:
    en-us:
      file: ./audio/en/ch_ep01_approach.ogg
      subtitle: 'Right ahead by the canal. Spot that surveillance cam on the perimeter mast: scan it with your Kiroshi, take control, and hop across the chain to camera two. You can Ping the crew or blow their server without even poking your head out.'
    es-es:
      file: ./audio/es/ch_ep01_approach.ogg
      subtitle: 'Ahí delante, junto al canal. Fíjate en la cámara de vigilancia sobre la antena perimetral: escanéala con tus Kiroshi, toma el control y salta por su red hasta la segunda cámara. Puedes marcarlos con Ping o detonar su servidor antes de sacar el arma.'
