  ch_ep03_ans_tygers:
    en-us:
      file: ./audio/en/ch_ep03_ans_tygers.ogg
      subtitle: Started as a Japantown neighborhood watch and street-bike crew right after twenty twenty-three. Once casinos, shipping docks, and black eddies hit the table, Arasaka started quietly supplying Shingen SMGs and jamming tattoos so the Tygers handle dirty street wetwork without smudging one corpo suit.
    es-es:
      file: ./audio/es/ch_ep03_ans_tygers.ogg
      subtitle: 'Empezaron como milicia de barrio y fanáticos de motos en Japantown allá por los tiempos del holocausto de dos mil veintitrés, reclamando respeto para las calles asiáticas. Pero cuando hay muelles, casinos y contrabando en juego, nadie dice no al dinero infinito: Arasaka les surte katanas, subfusiles Shingen y tinta inhibidora a cambio de hacer el trabajo sucio sin manchar un solo traje ejecutivo.'
    es-mx:
      file: ./audio/es/ch_ep03_ans_tygers.ogg
      subtitle: 'Empezaron como milicia de barrio y fanáticos de motos en Japantown allá por los tiempos del holocausto de dos mil veintitrés, reclamando respeto para las calles asiáticas. Pero cuando hay muelles, casinos y contrabando en juego, nadie dice no al dinero infinito: Arasaka les surte katanas, subfusiles Shingen y tinta inhibidora a cambio de hacer el trabajo sucio sin manchar un solo traje ejecutivo.'
