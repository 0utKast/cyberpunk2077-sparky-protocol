  ch_ep03_ans_unification:
    en-us:
      file: ./audio/en/ch_ep03_ans_unification.ogg
      subtitle: In twenty sixty-nine President Myers and Militech armor rolled over half the Free States to force everyone back into the NUSA. Night City had days left—until Saburo Arasaka parked a nuclear supercarrier in Coronado Bay. It saved the city's independence, sure, only by handing Arasaka the deed.
    es-es:
      file: ./audio/es/ch_ep03_ans_unification.ogg
      subtitle: En dos mil sesenta y nueve la presidenta Rosalind Myers y los tanques de Militech aplastaron a medio país para obligar a los Estados Libres a volver bajo la bandera del NUSA. Night City iba a caer en días... hasta que Saburo Arasaka plantó un superportaaviones nuclear en la bahía de Coronado. Salvó la independencia de la ciudad, sí, pero a cambio de sentarse en el sillón del dueño.
