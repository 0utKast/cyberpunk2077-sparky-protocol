  ch_ep03_outro:
    en-us:
      file: ./audio/en/ch_ep03_outro.ogg
      subtitle: Solid copy, rookie. Codex Volume Three is logged and Watson's whole dirty playbook is in your head now. Tear up the streets with Executive Curve—the minute NCPD drops those bridge lockdowns, Sector Four is waiting across Heywood and Santo Domingo.
    es-es:
      file: ./audio/es/ch_ep03_outro.ogg
      subtitle: 'A la orden, recluta. Ya tienes el Volumen Tres del códice guardado y media historia sangrienta de Night City en el bolsillo. Disfruta tu nueva «Curva Ejecutiva» por Watson: en cuanto caiga el bloqueo policial del puente, iremos a saldar cuentas por Heywood y Santo Domingo.'
