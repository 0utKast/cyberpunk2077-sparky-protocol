  ch_ep04_ans_valentinos:
    en-us:
      file: ./audio/en/ch_ep04_ans_valentinos.ogg
      subtitle: 'Started in Heywood mixing Santa Muerte faith, tight neighborhood pride, and gilded street style. Sounds noble until you inspect the ledger: protection rackets, gold-plated hit squads, and backroom arms deals whenever enough eddies hit the table.'
    es-es:
      file: ./audio/es/ch_ep04_ans_valentinos.ogg
      subtitle: 'Los Valentinos nacieron en las calles de Heywood con devoción a la Santa Muerte, tradición chicana y un código estricto de lealtad al barrio. Suena romántico hasta que ves la letra pequeña: protección pagada a golpe de revólver, sicarios con oro hasta en las muelas y contratos bajo cuerda con cualquiera que pague en metálico.'
