  ch_ep00_alley_approach:
    en-us:
      file: ./audio/en/ch_ep00_alley_approach.ogg
      subtitle: Hold your fire, trigger-happy! Scan those two geniuses and that industrial capacitor next to them with your Kiroshi optics first. Out here, bullets cost eddies and ripperdocs cost kidneys.
    es-es:
      file: ./audio/es/ch_ep00_alley_approach.ogg
      subtitle: Alto el fuego, gatillo fácil. Antes de entrar a lo loco como un novato, mantén pulsado el escáner Kiroshi sobre esos dos mastuerzos y sobre el condensador industrial de su lado. En esta ciudad las balas cuestan pasta, y los matasanos, un riñón.
