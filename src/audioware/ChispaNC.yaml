  ch_ep00_scan_react:
    en-us:
      file: ./audio/en/ch_ep00_scan_react.ogg
      subtitle: 'BINGO! Look at those Kiroshi flags: ungrounded junk chrome standing right next to a live industrial capacitor! Get within lock range to overload that bank remotely—or fry them your way.'
    es-es:
      file: ./audio/es/ch_ep00_scan_react.ogg
      subtitle: Ahí lo tienes, recluta. Implantes baratos sin toma de tierra y un condensador industrial echando chispas pegado a su culo. Acércate un poco y sobrecárgalo a distancia con tus ópticas... o cóselos a tiros, tú mismo.
