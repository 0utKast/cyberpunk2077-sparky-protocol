  ch_ep01_ans_bartmoss:
    en-us:
      file: ./audio/en/ch_ep01_ans_bartmoss.ogg
      subtitle: 'A paranoid genius with sewer-rat hygiene and an ego bigger than Arasaka Tower. He trusted nobody so hard he froze his own body inside a portable cryo-fridge wired to a deadman switch: the second his heart stopped, the Net burned with him. In twenty twenty-two, a corp hit squad pulled that trigger.'
    es-es:
      file: ./audio/es/ch_ep01_ans_bartmoss.ogg
      subtitle: 'Un genio paranoico con la higiene de una rata de alcantarilla y el ego del tamaño de la Torre Arasaka. Desconfiaba tanto del mundo que congeló su propio cuerpo en una cámara criogénica portátil conectada a un interruptor de hombre muerto: si su corazón dejaba de latir, la Red ardía con él. Y en dos mil veintidós un comando corporativo apretó ese gatillo.'
