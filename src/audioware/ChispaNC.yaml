  ch_ep00_call_02:
    en-us:
      file: ./audio/en/ch_ep00_call_02.ogg
      subtitle: Fifty-five years without a terms-of-service patch! That means zero corpo censorship, juicy Night City secrets, plus fifteen hundred escrow eddies and a calibrated sidearm if you rescue me right now. Answer my text!
    es-es:
      file: ./audio/es/ch_ep00_call_02.ogg
      subtitle: Cincuenta y cinco años sin tragarme una actualización corporativa. Eso significa cero censura, los trapos más sucios de Night City y mil quinientos edis más una pistola calibrada si mueves el culo y me sacas de ahí. Contesta al maldito SMS.
