      subtitle: 'MaxTac doesn''t answer muggings, rookie—they drop in when regular NCPD squads get shredded by a full-blown cyberpsycho. They run restricted military chrome and an open dirty secret: half their apex hunters are captured cyberpsychos wiped, chipped under corporate leashes, and turned loose on their own kind.'
    es-es:
      file: ./audio/es/ch_ep02_ans_maxtac.ogg
      subtitle: 'MaxTac no patrulla robos ni peleas de bar, recluta: entra cuando un ciberpsicópata desborda al resto de la policía. Llevan el mejor cromo militar prohibido al público y un secreto sucio a voces: buena parte de sus mejores agentes son antiguos ciberpsicópatas capturados vivos, recondicionados a la fuerza y sueltos contra otros igual de rotos que ellos.'
