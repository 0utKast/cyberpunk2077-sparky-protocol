  ch_ep05_ans_voodoo:
    en-us:
      file: ./audio/en/ch_ep05_ans_voodoo.ogg
      subtitle: Because they believe NetWatch's sentient Blackwall firewall will inevitably shatter—and they want a survival pact with rogue pre-Crash AIs before the flood hits. Meanwhile every outsider they hire is treated like a disposable human fuse.
    es-es:
      file: ./audio/es/ch_ep05_ans_voodoo.ogg
      subtitle: Porque son supervivientes paranoicos convencidos de que el Muro Negro va a caer tarde o temprano, y quieren pactar antes con las IAs salvajes que quedaron atrapadas al otro lado tras el DataKrash. NetWatch los persigue a muerte, y entretanto ellos contratan a mercenarios de fuera —«ranyons»— solo para quemarlos como señuelo.
