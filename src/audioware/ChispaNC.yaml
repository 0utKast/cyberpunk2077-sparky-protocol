  ch_ep03_ans_nuke:
    en-us:
      file: ./audio/en/ch_ep03_ans_nuke.ogg
      subtitle: 'I felt the concrete rattle from an armored vault two blocks away, rookie. August twentieth, twenty twenty-three—a Militech-backed raid with Morgan Blackhand and Johnny Silverhand set off a pocket nuke inside Arasaka Tower. Fallout painted the sky blood-crimson for years: The Time of the Red.'
    es-es:
      file: ./audio/es/ch_ep03_ans_nuke.ogg
      subtitle: 'Yo estaba en un servidor blindado a dos manzanas cuando tembló hasta el hormigón, recluta. El veinte de agosto de dos mil veintitrés un comando pagado por Militech —con Morgan Blackhand y Johnny Silverhand en el meollo— detonó una carga nuclear en la torre para rematar la Cuarta Guerra Corporativa. El cielo ardió rojo sangre años enteros: la Era del Rojo.'
