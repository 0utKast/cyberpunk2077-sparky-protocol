  ch_ep05_ans_pacifica:
    en-us:
      file: ./audio/en/ch_ep05_ans_pacifica.ogg
      subtitle: 'Same as every corner of Night City: short-term greed and fast evacuations. Corpo developers poured billions into hotel shells until pre-Unification War panic hit, yanked every credit overnight, and City Hall crossed Pacifica off the police map.'
    es-es:
      file: ./audio/es/ch_ep05_ans_pacifica.ogg
      subtitle: 'Igual que todo en Night City: avaricia a corto plazo y fuga por piernas. A finales de los sesenta querían levantar el resort de lujo definitivo para turistas corporativos. Cuando estalló la crisis previa a la Guerra de Unificación, cortaron el grifo, dejaron las grúas colgadas y el ayuntamiento borró el distrito del presupuesto policial de un plumazo.'
