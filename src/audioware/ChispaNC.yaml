  ch_ep00_ans_mega:
    en-us:
      file: ./audio/en/ch_ep00_ans_mega.ogg
      subtitle: Ten out of ten on architectural trauma! In twenty twenty-three, the Fourth Corporate War between Militech and Arasaka ended with a pocket nuke inside Arasaka Tower. Half the city turned into radioactive ash, so they threw up concrete hives like H10 as emergency arcologies—until gangs turned every floor into turf.
    es-es:
      file: ./audio/es/ch_ep00_ans_mega.ogg
      subtitle: ¡Bingo otra vez! En dos mil veintitrés, la Cuarta Guerra Corporativa entre Militech y Arasaka terminó con una bomba nuclear de bolsillo detonando en la Torre Arasaka. El centro quedó radiactivo y sin techo, así que Night Corp levantó estas colmenas de hormigón como refugios autosuficientes... que las bandas convirtieron rápido en fortalezas verticales.
